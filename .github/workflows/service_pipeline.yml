  # ---------------------------------------------------------------
  # Job 5: rollback. Runs if publish failed (or was cancelled).
  # (when API tests are enabled again: add api-tests to needs and to the if)
  # It restores "latest" and "previous" of THIS service to the digests
  # recorded before this run. A tag that did not exist before is
  # deleted. The workflow stays red because the failed job is still
  # failed. Needs a Docker Hub token with the Delete permission.
  # ---------------------------------------------------------------
  rollback:
    needs: [publish]
    if: always() && inputs.publish && (needs.publish.result == 'failure' || needs.publish.result == 'cancelled')
    # needs: [publish, api-tests]
    # if: >-
    #   always() && (
    #   needs.publish.result == 'failure' || needs.publish.result == 'cancelled'
    #   || needs.api-tests.result == 'failure' || needs.api-tests.result == 'cancelled')
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # No artifact = the job failed before touching the registry:
      # nothing to restore.
      - name: Download the saved registry state
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: promotion-state-${{ inputs.service }}
          path: ${{ runner.temp }}/state

      - name: Restore latest and previous
        env:
          HUB_USER: ${{ env.DOCKERHUB_USERNAME }}
          HUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          STATE="$RUNNER_TEMP/state/${{ inputs.service }}.json"
          if [ ! -f "$STATE" ]; then
            echo "::notice::No saved state for ${{ inputs.service }}: nothing to restore"
            exit 0
          fi

          IMAGE="$HUB_USER/rpm-${{ inputs.service }}"
          OLD_LATEST=$(jq -r .latest "$STATE")
          OLD_PREVIOUS=$(jq -r .previous "$STATE")

          # The tag did not exist before this run: delete it.
          # 204 = deleted, 404 = already absent.
          delete_tag() {
            local jwt code
            jwt=$(jq -n --arg u "$HUB_USER" --arg p "$HUB_TOKEN" '{username:$u,password:$p}' \
              | curl -s -H "Content-Type: application/json" -d @- https://hub.docker.com/v2/users/login \
              | jq -r .token)
            if [ -z "$jwt" ] || [ "$jwt" = "null" ]; then
              echo "::error::Docker Hub login failed"
              return 1
            fi
            code=$(curl -s -o /dev/null -w '%{http_code}' -X DELETE \
              -H "Authorization: JWT $jwt" \
              "https://hub.docker.com/v2/repositories/$IMAGE/tags/$1/")
            echo "delete $IMAGE:$1 -> HTTP $code"
            [ "$code" = "204" ] || [ "$code" = "404" ]
          }

          restore_tag() {
            if [ -n "$2" ]; then
              echo "restore $IMAGE:$1 -> $2"
              docker buildx imagetools create --tag "$IMAGE:$1" "$IMAGE@$2"
            else
              delete_tag "$1"
            fi
          }

          restore_tag latest "$OLD_LATEST"
          restore_tag previous "$OLD_PREVIOUS"

  # ---------------------------------------------------------------
  # Job 6: cleanup. Always runs at the end and removes the temporary state
  # artifact of THIS service (other services' artifacts are untouched,
  # because their rollback might still need them).
  # ---------------------------------------------------------------
  cleanup:
    needs: [publish, rollback]   # add api-tests when enabled
    if: always() && inputs.publish
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Delete the temporary state artifact of this service
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          ARTIFACT_NAME: promotion-state-${{ inputs.service }}
        run: |
          gh api "repos/$REPO/actions/runs/$RUN_ID/artifacts" \
            --jq ".artifacts[] | select(.name == \"$ARTIFACT_NAME\") | .id" \
          | while read -r ID; do
              gh api -X DELETE "repos/$REPO/actions/artifacts/$ID" \
                && echo "deleted artifact $ID"
            done