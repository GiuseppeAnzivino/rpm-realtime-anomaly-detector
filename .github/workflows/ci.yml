name: CI Microservices

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

# The workflow only needs to read the repository. Publishing to Docker Hub
# uses the DOCKERHUB_TOKEN secret, not the GitHub token.
permissions:
  contents: read

env:
  DOCKERHUB_USERNAME: giuseppeanzivino
  COVERAGE_THRESHOLD: "80"

jobs:
  # ---------------------------------------------------------------
  # Job 1: one run per microservice (matrix)
  # detect code -> checks -> tests with coverage -> build and push
  # of the image tagged ONLY with the commit SHA.
  # A service without source code is skipped, so the run stays green
  # while the services are still empty.
  # ---------------------------------------------------------------
  test-build-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - auth-service
          - detector-service
          - gateway-service
          - ingestion-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Keep this rule aligned with .github/scripts/check_tests.py:
      # the service is "empty" when src/ has no Python file besides __init__.py.
      - name: Detect whether the service has source code
        id: detect
        run: |
          SRC_DIR="microservices/${{ matrix.service }}/src"
          if [ -n "$(find "$SRC_DIR" -name '*.py' ! -name '__init__.py' 2>/dev/null | head -n 1)" ]; then
            echo "has_code=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_code=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No source code in ${{ matrix.service }}: checks, tests and image build are skipped"
          fi

      - name: Set up Python
        if: steps.detect.outputs.has_code == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check requirements.txt and install dependencies
        if: steps.detect.outputs.has_code == 'true'
        run: |
          REQ_FILE="microservices/${{ matrix.service }}/requirements.txt"

          if [ ! -s "$REQ_FILE" ]; then
            echo "::error::$REQ_FILE is missing or empty"
            exit 1
          fi

          for PKG in pytest pytest-cov; do
            if ! grep -qiE "^[[:space:]]*${PKG}([^A-Za-z0-9_-]|\$)" "$REQ_FILE"; then
              echo "::error::$PKG is not listed in $REQ_FILE"
              exit 1
            fi
          done

          pip install --upgrade pip
          pip install -r "$REQ_FILE"

      - name: Verify that every source file has a test file
        if: steps.detect.outputs.has_code == 'true'
        run: python .github/scripts/check_tests.py "microservices/${{ matrix.service }}"

      # pytest exits with an error if it collects no tests, so a tests/ folder
      # without real tests cannot pass. --cov-fail-under fails the step when
      # the tests execute less code than the configured threshold.
      - name: Run unit tests with coverage
        if: steps.detect.outputs.has_code == 'true'
        env:
          PYTHONPATH: microservices/${{ matrix.service }}/src
        run: |
          pytest "microservices/${{ matrix.service }}/tests" \
            --cov="microservices/${{ matrix.service }}/src" \
            --cov-report=term-missing \
            --cov-fail-under=${{ env.COVERAGE_THRESHOLD }}

      - name: Log in to Docker Hub
        if: steps.detect.outputs.has_code == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Only the immutable SHA tag is published here. "latest" is assigned
      # by the publish-latest job, after the API tests have passed.
      - name: Build and push Docker image (SHA tag only)
        if: steps.detect.outputs.has_code == 'true'
        uses: docker/build-push-action@v6
        with:
          context: microservices/${{ matrix.service }}
          file: microservices/${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ env.DOCKERHUB_USERNAME }}/rpm-${{ matrix.service }}:${{ github.sha }}

  # ---------------------------------------------------------------
  # Job 2: API tests on the whole stack, after all services are green.
  # DISABLED for now (if: false). Before enabling it:
  #   - add a compose file that uses image: ...:${IMAGE_TAG:-latest}
  #   - set the real compose file, gateway port and health endpoint
  #   - add the Postman collection and environment files
  # Then remove the "if: false" line.
  # ---------------------------------------------------------------
  api-tests:
    if: false
    needs: test-build-push
    runs-on: ubuntu-latest
    env:
      # The stack must run the images built in this commit, not "latest"
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start the stack
        run: |
          docker compose pull        # TODO: add "-f <file>" if the compose file is not docker-compose.yml
          docker compose up -d

      - name: Wait for the gateway
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/health; then   # TODO: gateway port and health endpoint
              exit 0
            fi
            sleep 2
          done
          echo "::error::Gateway not ready after 60 seconds"
          docker compose logs
          exit 1

      - name: Run Postman collections
        run: |
          npm install -g newman
          newman run postman/collection.json -e postman/ci.environment.json   # TODO: real paths

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop the stack
        if: always()
        run: docker compose down -v

  # ---------------------------------------------------------------
  # Job 3: assign "latest" to the images that passed the API tests.
  # No rebuild: the SHA-tagged image is retagged as latest.
  # It runs only if api-tests ran and succeeded, so while api-tests is
  # disabled no "latest" tag is published.
  # ---------------------------------------------------------------
  publish-latest:
    needs: api-tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - auth-service
          - detector-service
          - gateway-service
          - ingestion-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect whether the service has source code
        id: detect
        run: |
          SRC_DIR="microservices/${{ matrix.service }}/src"
          if [ -n "$(find "$SRC_DIR" -name '*.py' ! -name '__init__.py' 2>/dev/null | head -n 1)" ]; then
            echo "has_code=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_code=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No source code in ${{ matrix.service }}: nothing to promote"
          fi

      - name: Set up Docker Buildx
        if: steps.detect.outputs.has_code == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: steps.detect.outputs.has_code == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag the tested image as latest
        if: steps.detect.outputs.has_code == 'true'
        run: |
          IMAGE="${{ env.DOCKERHUB_USERNAME }}/rpm-${{ matrix.service }}"
          docker buildx imagetools create \
            --tag "$IMAGE:latest" \
            "$IMAGE:${{ github.sha }}"