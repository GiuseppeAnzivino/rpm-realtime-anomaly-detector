name: CI Microservices

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

# ===================================================================
# Every service has its OWN independent pipeline (service-pipeline.yaml):
#
#   detect -> test -> publish -> api-tests -> (ok) cleanup
#                                    |
#                                    └─> (fail) rollback -> cleanup
#
# If auth-service fails, gateway-service is still tested and published.
# To add a service, add one line to the matrix below.
# ===================================================================

jobs:
  services:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { service: auth-service,      kind: python,   path: microservices/auth-service }
          - { service: detector-service,  kind: python,   path: microservices/detector-service }
          - { service: gateway-service,   kind: python,   path: microservices/gateway-service }
          - { service: ingestion-service, kind: python,   path: microservices/ingestion-service }
          - { service: frontend,          kind: frontend, path: frontend }
    uses: ./.github/workflows/service_pipeline.yml
    with:
      service: ${{ matrix.service }}
      kind: ${{ matrix.kind }}
      path: ${{ matrix.path }}
    secrets: inherit
    permissions:
      contents: read
      actions: write